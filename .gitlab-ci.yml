include:
  - component: gitlab.com/thelabnyc/thelab-ci-components/review@0.9.0
    inputs:
      stage: build

variables:
  BASE_IMAGE: python
  FF_NETWORK_PER_BUILD: "true"

.versions:
  py314: &py314
    PYTHON_VERSION: "3.14@sha256:22caa054c0d309b1eee6f448326a8821a674a75b98653247fe706db90491fc87"
  py315: &py315
    PYTHON_VERSION: "3.15@sha256:f17ec845ebdd4f3347431579e1c22eaeec82913f039f2a54b937c7ff870bacdb"

stages:
  - build
  - manifest

.base_job: &base_job
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        TAG_SUFFIX: "-mr${CI_MERGE_REQUEST_IID}"
    # No suffix for default branch
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        TAG_SUFFIX: ""

build_docker_image:
  <<: *base_job
  stage: build
  image: docker:latest@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
  tags:
    - $RUNNER_TAG
  script:
    - apk add bash
    - if [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
      docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}";
      fi
    - ./bin/build.sh
  parallel:
    matrix:
      # Python 3.14
      - <<: *py314
        TARGET_STAGE: python
        MUTABLE_TAG_NAME: "3.14"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        TARGET_STAGE: python
        MUTABLE_TAG_NAME: "3.14"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

      # Python 3.15
      - <<: *py315
        TARGET_STAGE: python
        MUTABLE_TAG_NAME: "3.15"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        TARGET_STAGE: python
        MUTABLE_TAG_NAME: "3.15"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

      # Python 3.14 + Node 24
      - <<: *py314
        TARGET_STAGE: python-node
        NODE_VERSION: "24"
        MUTABLE_TAG_NAME: "3.14-node24"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        TARGET_STAGE: python-node
        NODE_VERSION: "24"
        MUTABLE_TAG_NAME: "3.14-node24"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

      # Python 3.14 + Node 26
      - <<: *py314
        TARGET_STAGE: python-node
        NODE_VERSION: "26"
        MUTABLE_TAG_NAME: "3.14-node26"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py314
        TARGET_STAGE: python-node
        NODE_VERSION: "26"
        MUTABLE_TAG_NAME: "3.14-node26"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

      # Python 3.15 + Node 24
      - <<: *py315
        TARGET_STAGE: python-node
        NODE_VERSION: "24"
        MUTABLE_TAG_NAME: "3.15-node24"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        TARGET_STAGE: python-node
        NODE_VERSION: "24"
        MUTABLE_TAG_NAME: "3.15-node24"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

      # Python 3.15 + Node 26
      - <<: *py315
        TARGET_STAGE: python-node
        NODE_VERSION: "26"
        MUTABLE_TAG_NAME: "3.15-node26"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"
        ARCH: amd64
        RUNNER_TAG: thelab-amd64
      - <<: *py315
        TARGET_STAGE: python-node
        NODE_VERSION: "26"
        MUTABLE_TAG_NAME: "3.15-node26"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"
        ARCH: arm64
        RUNNER_TAG: thelab-arm64

manifest:
  stage: manifest
  needs: [build_docker_image]
  tags:
    - thelab-arm64
  image: docker:latest@sha256:12e683a161823b2a839aeea999b9d960e6e1f9a97b1679ad6b441982e2d9cf07
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - apk add bash
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_JOB_TOKEN}" "${CI_REGISTRY}"
    - ./bin/push-manifest.sh
  parallel:
    matrix:
      - MUTABLE_TAG_NAME: "3.14"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}"
      - MUTABLE_TAG_NAME: "3.15"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}"
      - MUTABLE_TAG_NAME: "3.14-node24"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node24"
      - MUTABLE_TAG_NAME: "3.14-node26"
        IMMUTABLE_TAG_NAME: "3.14.${CI_PIPELINE_IID}-node26"
      - MUTABLE_TAG_NAME: "3.15-node24"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node24"
      - MUTABLE_TAG_NAME: "3.15-node26"
        IMMUTABLE_TAG_NAME: "3.15.${CI_PIPELINE_IID}-node26"
